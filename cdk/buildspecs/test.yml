version: 0.2

phases:
  install:
    runtime-versions:
      python: "3.11"
    commands:
      - pip install pytest boto3 pymysql --quiet || true

  build:
    commands:
      - echo "Running tests..."
      - |
        if [ -d "tests" ]; then
          pytest tests/ -v --tb=short
        else
          echo "No tests/ directory found — skipping."
        fi

reports:
  pytest_results:
    files:
      - "test-reports/**/*"
    file-format: JUNITXML
