version: 0.2

# Deploys the full stack (including music-store-tools Lambda) via CDK.
# pip pre-installs Lambda dependencies into the source directory so CDK
# bundles them into the asset zip without needing Docker.

phases:
  install:
    runtime-versions:
      nodejs: "18"
      python: "3.11"
    commands:
      - cd cdk && npm ci --quiet && cd ..
      - pip install -r lambdas/music_store_tools/requirements.txt -t lambdas/music_store_tools/ --quiet

  build:
    commands:
      - echo "Deploying infrastructure and Lambda via CDK..."
      - cd cdk && npx cdk deploy MusicStoreStack --require-approval never --outputs-file ../cdk-outputs.json
      - echo "Deploy complete."

artifacts:
  files:
    - cdk-outputs.json
